name: release

# Publishes when the version in Directory.Build.props changes and no tag exists for it yet.
on:
  push:
    branches: [main]
    paths: [Directory.Build.props]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    name: check version
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.read.outputs.version }}
      needed: ${{ steps.read.outputs.needed }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: read
        run: |
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props | head -1)

          if [ -z "$version" ]; then
            echo "No <Version> found in Directory.Build.props" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

          if git rev-parse "v$version" >/dev/null 2>&1; then
            echo "v$version is already released, nothing to do"
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "v$version has no tag yet, releasing"
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: build ${{ matrix.name }}
    needs: version
    if: needs.version.outputs.needed == 'true'
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-latest
            name: macos
            publish: ./build/publish.sh
          - os: windows-latest
            name: windows
            publish: pwsh ./build/publish.ps1

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      # Never ship a build whose tests did not run.
      - name: Test
        run: dotnet test -c Release

      - name: Publish
        run: ${{ matrix.publish }}

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: artifacts/*.zip
          if-no-files-found: error

  release:
    name: release
    needs: [version, build]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          notes=$(cat <<'END'
          Download the archive for your machine, unzip it, and run either the window
          (**Rhino Settings Transfer**) or the command line (`rh-transfer`).

          Close Rhino before importing. Personal details are always removed on export.

          The macOS build is not signed or notarised, so Gatekeeper will block it on first run:
          right click the app and choose Open, or `xattr -dr com.apple.quarantine <the app>`.
          END
          )

          gh release create "v$VERSION" dist/*.zip \
            --title "v$VERSION" \
            --notes "$notes"
