name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release

      # The window needs a desktop session, so prove the command line works instead.
      # An empty data root exercises discovery without touching a real Rhino folder.
      - name: Smoke test the command line
        shell: bash
        run: |
          dotnet run --project src/RhTransfer.Cli -c Release --no-build -- list --data-root "$(mktemp -d)"
